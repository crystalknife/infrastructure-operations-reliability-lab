server {
    listen 8080;
    server_name localhost;

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location = /nginx_status {
        stub_status;
        access_log off;
        allow 172.30.0.0/24;
        deny all;
    }

    location / {
        default_type text/plain;
        return 200 "Agent Reliability Lab infrastructure sandbox\n";
    }
}
